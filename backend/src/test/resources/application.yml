spring:
  datasource:
    url: jdbc:h2:mem:ecom-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    open-in-view: false

app:
  access-token-ttl: 300
  refresh-token-ttl: 604800
